# The iPhone app. No Mac: XcodeGen makes the project on a GitHub Actions runner (.github/workflows/ios.yml), which
# tests CarKit, signs the app and sends it to TestFlight.
name: RCCar
options:
  bundleIdPrefix: com.julienmalige
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CarKit:
    path: ../CarKit
targets:
  RCCar:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: CarKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: RC Car
        CFBundleName: RC Car
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: RC Car uses Bluetooth to find your remote-control car and drive it.
        ITSAppUsesNonExemptEncryption: false
        # the isometric game's two faces (SIL Open Font License, Resources/Fonts): Barlow for words, Saira for figures
        UIAppFonts:
          - BarlowSemiCondensed-SemiBold.ttf
          - BarlowSemiCondensed-Bold.ttf
          - BarlowSemiCondensed-ExtraBold.ttf
          - Saira-ExtraBoldItalic.ttf
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julienmalige.rccar
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
schemes:
  RCCar:
    build:
      targets:
        RCCar: all
    archive:
      config: Release
