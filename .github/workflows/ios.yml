name: iOS app

# The app (app/, CarKit/) to TestFlight with no Mac: CarKit's tests run first (`swift test`, the cars' packet formats),
# XcodeGen makes the project, the UI tests drive the app on a simulator, then the runner archives and signs it and
# uploads it to App Store Connect. Signing is manual,
# as Ultimate Motorsports' and TV Scores' (the team's App Store Connect key and distribution certificate, this app's
# own App Store profile, all repository secrets). Without the secrets it only compiles, unsigned. A private
# repository's macOS minutes count ten times: it builds only when the app changes, and a newer push cancels the build
# before it.

on:
  push:
    branches: [main]
    paths: ['app/**', 'CarKit/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and upload
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      BUNDLE_ID: com.julienmalige.rccar
      PROFILE: RC Car iOS App Store
    steps:
      - uses: actions/checkout@v4

      - name: Signed or not
        id: mode
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_BASE64: ${{ secrets.DIST_PROFILE_BASE64 }}
        run: |
          signed=true
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_TEAM_ID ASC_KEY_P8 DIST_P12_BASE64 DIST_P12_PASSWORD DIST_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::warning::secret $name is not set: compile only, no upload"
              signed=false
            fi
          done
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -q iphoneos; then
            sudo xcodebuild -downloadPlatform iOS
          fi

      - name: CarKit tests
        run: swift test --package-path CarKit

      - name: Generate the Xcode project
        working-directory: app
        run: |
          command -v xcodegen || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      # On an iPhone simulator, as TV Scores' flows run: the app driven by touch (app/UITests).
      - name: UI tests
        working-directory: app
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone")) | .udid' \
            | head -1)
          echo "simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test \
            -project RCCar.xcodeproj \
            -scheme RCCar \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/uitest.log" | grep -E "error:|Test Suite|Test Case|passed|failed|\*\* TEST" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/uitest.log"

      - name: Compile (unsigned)
        if: steps.mode.outputs.signed != 'true'
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build \
            -project RCCar.xcodeproj \
            -scheme RCCar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"

      - name: Write the App Store Connect key
        if: steps.mode.outputs.signed == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8
          chmod 600 ~/private_keys/AuthKey_"$ASC_KEY_ID".p8

      - name: Install the signing certificate and profile
        if: steps.mode.outputs.signed == 'true'
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_BASE64: ${{ secrets.DIST_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(openssl rand -hex 24)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '\"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$keychain" | sed 's/[0-9A-F]\{40\}/HASH/'
          # Xcode 16 and later read the first path, older tooling the second.
          for dir in ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles \
                     ~/Library/MobileDevice/Provisioning\ Profiles; do
            mkdir -p "$dir"
            echo "$DIST_PROFILE_BASE64" | base64 --decode > "$dir/rccar.mobileprovision"
          done

      - name: Archive
        if: steps.mode.outputs.signed == 'true'
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project RCCar.xcodeproj \
            -scheme RCCar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RCCar.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning:|Signing|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Export and upload to App Store Connect
        if: steps.mode.outputs.signed == 'true'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$ASC_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RCCar.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E "error:|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log"

      - name: Remove the key and the keychain
        if: always() && steps.mode.outputs.signed == 'true'
        run: |
          rm -f ~/private_keys/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # Only on failure, and redacted first: GitHub masks secrets in the console but not inside uploaded files, and
      # xcodebuild prints the team id in the signing identity and the key id in the key path.
      - name: Redact the logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/build.log "$RUNNER_TEMP"/archive.log "$RUNNER_TEMP"/export.log; do
            [ -f "$f" ] || continue
            [ -n "$ASC_TEAM_ID" ] && sed -i '' -e "s/$ASC_TEAM_ID/TEAMID/g" "$f"
            [ -n "$ASC_KEY_ID" ] && sed -i '' -e "s/$ASC_KEY_ID/KEYID/g" "$f"
            [ -n "$ASC_ISSUER_ID" ] && sed -i '' -e "s/$ASC_ISSUER_ID/ISSUERID/g" "$f"
          done
          true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/uitest.log
          if-no-files-found: ignore
